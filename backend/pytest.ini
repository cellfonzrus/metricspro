# pytest configuration for the MetricsPro backend suite. See docs/TESTING.md.
#
# `rootdir` is backend/, so `python -m pytest` from backend/ and `pytest backend` from the repo root
# both work. The 597 `backend/harness_*.py` proof scripts are NOT collected here: they are standalone
# programs with their own CI jobs (see docs/TESTING.md §"Harnesses and tests"), and collecting them
# would run heavy proofs on every unit-test loop.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --import-mode=importlib
markers =
    unit: pure logic, no app, no I/O (tests/unit/*, auto-applied)
    integration: the real FastAPI app over the database double (tests/integration/*, auto-applied)
filterwarnings =
    ignore::DeprecationWarning
