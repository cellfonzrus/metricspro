  ci-gate-index:
    # The lock on gate VISIBILITY. `docs/CI_GATES.md` is generated from the workflow files by
    # `backend/ci_gates.py` — the one home for "which workflow job runs this gate" — and this job
    # fails the build when the page and the workflows disagree. Regenerate with
    # `python3 backend/harness_ci_gate_index.py --bless`; never edit the page by hand.
    name: The gate index is current (lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_ci_gate_index
        working-directory: backend
        run: python3 harness_ci_gate_index.py | tee -a "$GITHUB_STEP_SUMMARY"
