name: tests

# THE TEST GATE (project directive 2026-10-28, docs/TESTING.md).
#
# Owner, verbatim: *"We need to define all development we do to follow the following / Unit testing /
# Integration testing / Test driven development"*.
#
# WHAT WAS HERE BEFORE: no test job of any kind. The repo had 597 `backend/harness_*.py` proof
# programs (330 run by no workflow), one pytest-shaped file that no job executed, and 12
# `frontend/tools/*-proof.mjs` programs that no workflow ran at all. (The frontend's typecheck and
# lint ratchet WERE already gated — inside `carrier-vocab-guard.yml`, whose name says nothing about
# either.) This workflow is the gate that makes a test a gate.
#
# ENFORCING, not report-only. A red job blocks the merge. That is the point: a suite that cannot
# fail a build is documentation with a stopwatch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# REQUIRED by backend/harness_ci_pipefail_lock.py (index §19.25): without an explicit bash shell,
# GitHub's default `bash -e` has NO pipefail, so `python x.py | tee …` passes on a red program.
defaults:
  run:
    shell: bash

jobs:
  backend-unit:
    # Pure logic, no app, no I/O. Fast — this is the job a developer's inner loop mirrors.
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest -m unit
        working-directory: backend
        run: python -m pytest tests -m unit

  backend-integration:
    # The REAL FastAPI app over Starlette's TestClient, against the in-memory database double.
    # There is no staging Supabase, so conftest blocks every outbound socket and blanks every
    # credential: this job CANNOT reach production, by construction rather than by convention.
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest -m integration
        working-directory: backend
        run: python -m pytest tests -m integration

  frontend-tests:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: install
        working-directory: frontend
        run: npm ci
      - name: vitest
        working-directory: frontend
        run: npm run test

  frontend-proofs:
    # The 12 standalone `tools/*-proof.mjs` programs, which no workflow ran until today. Behind a
    # register that may only shrink (tools/proof_red_pending.txt): 8 are gated, 4 are declared red.
    name: Frontend proofs (shrink-only register)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: install
        working-directory: frontend
        run: npm ci
      - name: proofs
        working-directory: frontend
        run: npm run test:proofs

  mobile-tests:
    # The app's PURE logic. `mobile/` had no test of any kind until 2026-10-30, which is how the
    # "Choose a company" screen shipped printing raw org ids: there was no gate a label rule could
    # fail. Node environment, no device, no emulator — a screen test belongs behind a renderer.
    name: Mobile unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - name: install
        working-directory: mobile
        run: npm ci
      - name: vitest
        working-directory: mobile
        run: npm run test

  action-plan-tiles-lock:
    # The design lock for the Daily Action Plan's tiles (index §COMMCALC-57): ONE grouping of the
    # verdicts the endpoint already reached, over the vocabulary the TENANT declared, with
    # "not measured" surviving into the tile and into the mailed copy. Wired here on the day the
    # harness was written — a harness no workflow runs is a file, not a gate.
    name: One tile fold, the tenant's own metrics (lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_action_plan_tiles
        working-directory: backend
        run: python harness_action_plan_tiles.py

  punch-geofence-lock:
    # The design-fix lock for the punch geofence (index §STOREOPS-14): one distance calculation, one
    # store pin, one column home, and a punch that is flagged rather than refused. Wired here on the
    # day the harness was written — a harness no workflow runs is a file, not a gate
    # (backend/harness_unrun_pending.txt's own reason for existing).
    name: One geofence decision, one store pin (lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_store_geofence_lock
        working-directory: backend
        run: python harness_store_geofence_lock.py

  geo-retention-lock:
    # The design-fix lock for GPS retention (index §CORE-14): one registry of every relation that
    # stores where a person was, one date arithmetic, one sweep, and a purge that clears coordinates
    # while KEEPING the verdict and the distance. Wired on the day the harness was written — a
    # harness no workflow runs is a file, not a gate.
    name: One GPS retention promise, kept (lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_geo_retention_lock
        working-directory: backend
        run: python harness_geo_retention_lock.py

  portal-backfill-lock:
    # The design-fix lock for the portal pull backlog (index §COMMCALC-59): one home for which span a
    # login still owes, one window ceiling dereferenced from the pull loop, one natural key matching
    # migration 1116, and one fact for "a row pulled through a store's login belongs to that store".
    # Wired on the day the harness was written — a harness no workflow runs is a file, not a gate.
    name: One home for the span a pull owes (lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: harness_portal_backfill
        working-directory: backend
        run: python harness_portal_backfill.py

  test-discipline:
    # The lock: the framework above cannot quietly come undone. It RUNS conftest's network guard
    # against a production hostname rather than reading the source for it.
    name: The test framework stays wired (lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: install (pytest only — the lock itself is stdlib)
        run: pip install pytest
      - name: harness_test_discipline
        working-directory: backend
        run: python harness_test_discipline.py

  # ── THE UNRUN HARNESS SUITE (2026-11-04) ───────────────────────────────────────────────────────
  # 312 `backend/harness_*.py` proof programs were declared on `harness_unrun_pending.txt` — the
  # house debt list for "a harness no workflow runs". Every one of them was MEASURED on 2026-11-04
  # by running it; 267 passed. Those 267, plus the five that `harness_ci_pipefail_lock.py` had
  # wrongly exempted because a workflow MENTIONED their filename in a comment or a `paths:` filter
  # without ever invoking them, run here. Split four ways purely to keep wall time near 2 minutes;
  # the split is by measured duration, so moving a harness between groups changes nothing but time.
  #
  # 45 stay on the debt list because they are genuinely RED (44) or reach the network (1). None was
  # skipped, disabled or quarantined to get here: a red harness is still declared, still counted,
  # and the list may still only shrink.

  harness-suite-1:
    name: Proof harnesses, group 1 of 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # FULL HISTORY, not the default depth-1. Nine of these proofs reproduce the defect they fix
        # against a historical commit first — a live negative control, so that a proof cannot pass by
        # asserting something that was never broken. Under a shallow checkout that `git show` fails
        # and the proof dies in its own setup: `harness_agency_ocr_async` did exactly that here on
        # 2026-11-04 while passing locally, which is why the suite fetches history rather than
        # declaring nine working proofs dead (index §CORE-35).
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: harness_activation_basis_policy
