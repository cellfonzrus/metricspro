      - name: Run the KPI vintage / honest-denominator / registry pay-engine proof (the owner's 4-vs-7; a KPI with no basis is no_data, never a failed zero; the count reconciliation to the carrier; HOUSE pay byte-identical — index §19.28)
        working-directory: backend
        run: python3 harness_kpi_vintage.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the rep-incentive month-range proof (every month of a range == that month viewed alone; one month enumeration; the cap — index §6g)
        working-directory: backend
        run: python3 harness_rep_incentive_range.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the multi-month offer proof (configured / off / off-with-money; the R1 guard unchanged; the status endpoint — index §6h)
