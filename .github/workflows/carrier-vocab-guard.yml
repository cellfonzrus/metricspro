      - "docs/SYSTEM_DATA_FLOW_INDEX.md"
      - "frontend/src/**"
      - "backend/app/**/*.py"   # index §19.36 — the setup-internals lock scans every backend string + the boundary
      - "database/migrations/**"   # index §19.39 — the infra-names lock derives its table / schema registry from them
      - "backend/harness_account_expenses_one_home.py"
      # index §CORE-17 — the drill-down one home, its coverage ratchet and the ledger. Named here
      # as well as covered by the wildcards above, per the §13e lesson: a job behind an allowlist
