permissions:
  contents: read

concurrency:
  group: carrier-vocab-guard-${{ github.ref }}
  cancel-in-progress: true

# Every step runs under `bash -eo pipefail` (GitHub's explicit-bash shell). Without this, the default
# `bash -e` has NO pipefail, so `python3 harness_x.py | tee …` passed even when the harness failed — every lock
# here was silently unenforced until 2026-09-24. Locked by backend/harness_ci_pipefail_lock.py.
defaults:
  run:
    shell: bash

jobs:
  carrier-vocab-guard:
    name: No cross-side carrier vocabulary in page copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run carrier vocabulary guard (+ the POS vocabulary axis, index §26.10, + the setup-internals axis, §19.36, + the infra-names axis, §19.39)
        working-directory: backend
        run: python3 harness_carrier_vocab_guard.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Run the finance-expenses lock (one home for "expenses"; hub, drill-down, P&L and narrative dereference it)
        working-directory: backend
        run: python3 harness_account_expenses_one_home.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the labour-vocabulary lock + proof (one home for the platform's labour rows; the default is CORRECT; no second copy — index §4e)
        working-directory: backend
        run: python3 harness_labour_vocabulary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the P&L drill-detail proof + lock (a scope explains its own number; no second drill derivation — index §4e)
        working-directory: backend
        run: python3 harness_pl_drill_detail.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the chart-caption lock (every Trends chart says what a move MEANS; one home, ungated — index §56)
        working-directory: backend
        run: python3 harness_trends_chart_notes.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the scope display-name lock (one home for a scope's name; no `scope_label || scope_key`; every finance surface wired — index §13b.1)
        working-directory: backend
        run: python3 harness_scope_label_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the scope display-name proof (a null / stale stored label renders the company's CURRENT name; no uuid ever rendered)
        working-directory: backend
        run: python3 harness_scope_label.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-kind lock (every upload surface reads the registry; no second list)
        working-directory: backend
        run: python3 harness_report_kind_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the connector-scope lock (every connector surface reads the registry; mirror = seed; one neutral line; no second list)
        working-directory: backend
        run: python3 harness_connector_scope_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the human-check lock (a check that GATES the submit counts whether or not it is painted; each kind gets its own words)
        working-directory: backend
        run: python3 harness_human_check_kind.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the terminal-status lock (a session that ends restores the row's real status; an in-flight claim cannot outlive its worker - index COMMCALC-13)
        working-directory: backend
        run: python3 harness_terminal_status.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the live-session-host lock (an endpoint that touches the session registry runs in the process that HAS it - index COMMCALC-24)
        working-directory: backend
        run: python3 harness_live_session_host.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the live-input-latency lock (the operator's clicks are drained before the next frame tick, and nothing waits on work that only matters once they stop - index COMMCALC-27)
        working-directory: backend
        run: python3 harness_live_input_latency.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the mapping-key lock (one derivation per statement type; no literal mapping key)
        working-directory: backend
        run: python3 harness_mapping_key_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-links lock (one pairing implementation; the links and the inventory check call it)
        working-directory: backend
        run: python3 harness_report_links_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
