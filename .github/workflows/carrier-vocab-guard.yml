      - name: Run the accessory-vocabulary live-month proof (the gap reproduces and closes; the detector reads the one union, not the dead archive — index §19.49)
        working-directory: backend
        run: python3 harness_accessory_definition_live_month.py | tail -45 | tee -a "$GITHUB_STEP_SUMMARY"

