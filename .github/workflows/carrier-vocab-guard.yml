      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the bill-pay fee / activation-candidate proof (the 690 stay silent; the real gap is still reported; the other tenant byte-identical — index §19.42)
        working-directory: backend
        run: python3 harness_billpay_fee_not_activation.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE SCHEDULE-FROM-WORK-HISTORY PROOF (index §14v) drives the REAL
  # storeops/schedule_from_history.py over in-memory transaction rows: the calendar arithmetic against
  # date.weekday(), nearest-rank percentiles with OUTWARD rounding (the derived shift always contains the
  # observed one), relief gets no recurring rows, both readings of the coverage denominator, no invented
  # measurement, the store-alias and lost-page regressions, and the UN-WIRING LOCK — the tool must keep
  # dereferencing the module and storeops.shift_templates stays the only table it inserts into, so a
  # sibling schedule-generation path fails the build. stdlib only, DB-free.
  schedule-from-history-proof:
    name: Schedule from work history (DB-free, the real module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the schedule-from-history proof (the inference is stated and outward-rounded; relief is not a weekly commitment; one derivation, one destination table — index §14v)
        working-directory: backend
        run: python3 harness_schedule_from_history.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE NOTIFY SEND-IDENTITY PROOF (index §15.3) pins the ONE home for "which report does this send
  # record name" — notify/send_identity.py — over the real module: the registry label wins over any
  # browser-supplied spelling, a client export carries the report's NAME instead of the old
  # "(client-export)" literal (the owner's 2026-10-05 report), a row written before mig 1057 still
  # displays a name because the READ resolves it, and the UN-WIRING LOCKS — an AST scan of every
  # send_log row literal in notify/router.py fails the build if a send path goes back to naming the
  # report itself, with the pre-fix row as an armed control. stdlib only, DB-free.
  notify-send-identity-proof:
    name: Notify history names the report sent (DB-free, the real module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the notify send-identity proof (one home for the report's name; the history never shows a machine key — index §15.3)
        working-directory: backend
        run: python3 harness_notify_send_identity.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE DATABASE-RESILIENCE PROOF — owner directive 2026-10-08 ("do it"), taking this file off
  # backend/harness_unrun_pending.txt. It is the only thing asserting that a dropped Supabase
  # connection is retried rather than surfaced as a 500, and it asserts that through the REAL
  # app.core.db_resilience over a local socket that genuinely disconnects, plus source-level reads of
  # the installed postgrest / httpcore.
  #
  # Two of its checks are TRIPWIRES by design, and a red one here is a question for a human, not a
  # test to edit away:
  #   A1  pins the exact installed versions of supabase / postgrest / httpx / httpcore / h2. It fires
  #       on ANY version move, because the root cause is read out of those packages' own source. The
  #       answer is to RE-READ the sources and then advance the pin (see the dated notes above
  #       PINNED_STACK for how 2026-09-06 and 2026-10-08 were handled) — never to relax it.
  #       `backend/requirements.txt` is named in this workflow's paths for exactly this reason: a lock
  #       whose allowlist does not name its own subject skips silently (the §13e lesson).
  #   I0  pins the app's leaf route count, so it fires on any PR that adds or removes an endpoint.
  #       That is expected and cheap: confirm the delta is yours and nothing was REMOVED, then
  #       re-pin, documenting the delta the way the comment block above _expect_routes does. I0b is
  #       the drift-proof form of the same claim and never needs re-pinning.
  # It imports the app and inspects the installed stack, so it runs with the backend's dependencies.
  db-resilience-proof:
    name: Database resilience (the real transport, a socket that really drops)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the database-resilience proof (a dropped idle connection is retried, never a 500; writes are never replayed; A1 = version canary, I0 = route-count tripwire)
        working-directory: backend
        shell: bash
        run: python3 harness_db_resilience.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
