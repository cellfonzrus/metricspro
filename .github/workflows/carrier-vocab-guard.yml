    branches: [main]
    paths:
      - "frontend/src/**"
      - "backend/app/modules/commcalc/report_kinds.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carrier-vocab-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carrier-vocab-guard:
    name: No cross-side carrier vocabulary in page copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run carrier vocabulary guard (+ the POS vocabulary axis, index §26.10)
        working-directory: backend
        run: python3 harness_carrier_vocab_guard.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Run the finance-expenses lock (one home for "expenses"; hub, drill-down, P&L and narrative dereference it)
        working-directory: backend
        run: python3 harness_account_expenses_one_home.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-kind lock (every upload surface reads the registry; no second list)
        working-directory: backend
        run: python3 harness_report_kind_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the connector-scope lock (every connector surface reads the registry; mirror = seed; one neutral line; no second list)
        working-directory: backend
        run: python3 harness_connector_scope_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the mapping-key lock (one derivation per statement type; no literal mapping key)
        working-directory: backend
        run: python3 harness_mapping_key_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-links lock (one pairing implementation; the links and the inventory check call it)
        working-directory: backend
        run: python3 harness_report_links_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the landing-identity lock (every writer stamps the report kind; one consumers map; every surface says where)
        working-directory: backend
        run: python3 harness_landing_identity_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the line-class lock (one activation-type predicate; one rules home; every caller dereferences it)
        working-directory: backend
        run: python3 harness_line_class_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the line-class proof (the money compatibility pin + the suggestion engine over the measured vocabulary)
        working-directory: backend
        run: python3 harness_line_class.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the tender-vocab lock (one tender vocabulary; every classifier dereferences it)
        working-directory: backend
        run: python3 harness_tender_vocab_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the P&L-commission-source lock (one resolver; the ledger booking dereferences the registry; a derived suppression set; one sum; every surface wired)
        working-directory: backend
        run: python3 harness_pl_commission_source_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      # index §4a / §4a.1 / §4a.2 — the MA money, the month-of-life LEG and the ladder's RUNG
      # convention each have ONE home. These locks shipped with #270/#272 but were never wired into
      # CI, so nothing failed the build when a caller stopped dereferencing them. Wiring them is the
      # "lock it so it cannot un-wire" half of the design-fix rule; both are stdlib-only and DB-free.
      - name: Run the MA one-home guard (MA income · the month LEG · the ladder RUNG convention)
        working-directory: backend
        run: python3 harness_ma_income_one_home_guard.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the month-of-life column proof (data-driven rungs; August 2026 split pinned)
        working-directory: backend
        run: python3 harness_ma_month_columns.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the any-subset-columns lock (no column-block ladder anywhere; one reading rule; every named reader on it; credential rows projected)
        working-directory: backend
        run: python3 harness_any_columns_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the POS sales-from-reports lock (one receipt document shape, one importer, one renderer; the format follows the declared POS)
        working-directory: backend
        run: python3 harness_pos_sales_from_reports_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the plan-sources lock (one registry of plan-name sources; one resolver for preview and apply; one writer; the card seeds from the proposal; no vendor)
        working-directory: backend
        run: python3 harness_plan_sources_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the ledger statement-identity lock (one identity derivation, one period home, one lander; every ledger read on the family; N landings refused — index §30.15)
        working-directory: backend
        run: python3 harness_ledger_identity_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
