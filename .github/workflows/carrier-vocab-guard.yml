  # THE SWEEP-FAILURE VISIBILITY PROOF (index §43) drives the REAL app/core/import_batches reaper decision and
  # reads the connector-health predicate out of the commcalc router: a batch a dead run stranded in `parsing` is
  # reaped (a `finally` cannot do it — the process was killed), reaping releases the partial unique index so the
