  # THE FRONTEND TYPE CHECK (index §75, owner directive 2026-10-10: "fix the frontend type error").
  # Nothing in this repo ran `tsc` as a gate. A `SCREENS` key outside the closed `ScreenKey` union in
  # components/ScreenLink.tsx made the compiler red, all 49 checks on PR #432 stayed green on every
  # head, the Vercel deploy was RED on every one of them — and Vercel is not a required check, so its
  # red told nobody. The error was found by hand. This job is the gate; the instance is already fixed.
  #
  # It lives HERE, in carrier-vocab-guard, rather than in a new workflow, because this workflow already
  # fires on `frontend/src/**` for BOTH pull_request and push, already declares the top-level
  # `defaults: run: shell: bash` that the pipefail lock requires, and already carries the
  # setup-node@v4 / `npm ci --ignore-scripts` recipe (see pl-drill-path-proof below). A new workflow
  # would duplicate all three. It is its OWN job rather than a step inside pl-drill-path-proof so that
  # a whole-frontend type failure does not report as "P&L drill-path proof" failing, and so the two
  # gates do not share a runtime.
  #
  # ONE HOME for the command: frontend/package.json's `typecheck` script. CI dereferences it rather
  # than spelling `tsc --noEmit` a second time, so what CI checks is exactly what a developer runs.
  # `next typegen` inside that script generates next-env.d.ts (gitignored) and .next/types, both of
  # which tsconfig.json `include`s — without it CI would check LESS than the Vercel build does.
  # Locked by backend/harness_frontend_typecheck_lock.py (run in the guard job above).
  frontend-typecheck:
    name: Frontend type check (tsc --noEmit over the whole frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      # The lock lives in THIS job, beside the gate it guards, rather than in the dependency-free
      # carrier-vocab-guard job above: a lock belongs with the thing it guards, and in a 94-step job
      # it would sit behind 90 unrelated steps, any one of whose failure would stop it from running
      # at all (§19.25 — a gate that does not run is not a gate). It is stdlib-only and needs no
      # node_modules, so it runs BEFORE the install: its verdict is reported even when tsc itself is
      # what goes red.
      - name: "Run the frontend type-check gate lock (index §75): the gate has ONE home, a workflow runs it with node_modules installed, its path filter covers frontend/**, and strictness / ignoreBuildErrors / blanket @ts-ignore cannot be used to reach green"
        working-directory: backend
        run: python3 harness_frontend_typecheck_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the frontend's dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check the whole frontend (the ONE home — package.json `typecheck`)
        working-directory: frontend
        run: npm run typecheck 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE FRONTEND LINT GATE (index §CORE-02, owner 2026-10-11: *"Run the code style checker and fix the
  # problems"*). `frontend/package.json` declared a `lint` script all along and NOTHING ran it —
  # measured on main: 5953 findings over 422 files, reported by nobody. The same §19.25 class as the
  # type-check hole #438 closed one layer over, and it ships the same way: the lock first (stdlib,
  # pre-install, so its verdict survives a red lint step), then `npm ci`, then the gate.
  #
  # The gate is a RATCHET, not a clean check: 4903 of those findings are `no-explicit-any` and 666
  # are React-Compiler/hook rules whose fixes change RUNTIME BEHAVIOUR in commission, payroll,
  # closing and P&L pages — 5569 money-touching behaviour changes are not a decision a lint job makes
  # on the owner's behalf. So frontend/eslint_pending.txt pins today's debt, anything NEW fails, and
  # the register may only shrink. Unlike #438 (which refused to create a zero-entry ratchet), this
  # register holds real entries.
  frontend-lint:
    name: Frontend lint (eslint over the whole frontend, ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: "Run the frontend lint gate lock (index §CORE-02): the linter has ONE home, a workflow runs it with node_modules installed, its path filter covers frontend/**, and the config's rule sets, the ignores, the suppression ceiling and the pinned register cannot be relaxed to reach green"
        working-directory: backend
        run: python3 harness_frontend_lint_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the frontend's dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the whole frontend against the pinned register (the ONE home — package.json `lint`, dereferenced by `lint:gate`)
        working-directory: frontend
        run: npm run lint:gate 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE CUSTOMER-MASTER PROOF (index §30.16) drives the REAL matcher, rebuild, line writer and /pos endpoints over the
