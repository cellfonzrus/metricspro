      # §COMMCALC-24 — the gate's NAME-LIST lives here and three locks dereference it, so a change
      # to it must re-run all of them.
      - "backend/app/core/service_role.py"
      # index §40.12 — rule 8 locks these two, so a change to either must run the lock that guards it
      # (the §13e lesson: a job behind an allowlist that does not name its own subject skips silently).
      - "scripts/check_deploy_reachability.py"
      - ".github/workflows/deploy-reachability.yml"
      - "backend/harness_cors_policy.py"
      - "backend/app/core/cors_policy.py"
      - "backend/app/modules/payables/router.py"
      - "backend/app/modules/account/royalty.py"
      - "backend/app/modules/account/royalty_router.py"
      - "backend/app/modules/account/centers.py"
      - "backend/app/modules/account/sales_line_map.py"
