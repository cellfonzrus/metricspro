      - "backend/harness_report_drilldown.py"
      - "backend/harness_drilldown_coverage.py"
      - "backend/harness_drilldown_pending.txt"
      - "backend/app/modules/core/report_drilldown.py"
      - "frontend/src/components/DrillDownPanel.tsx"
      # §CORE-17.3a — the TILE fold and the first report declared against it.
