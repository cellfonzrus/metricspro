      - name: "Manager report cards (index §59.9): the three-state check-off where absence is never performance, the item registry wired rather than decorative, the roll-up and the org tree INJECTED, and the summary CALLED rather than reassembled"
        working-directory: backend
        run: python3 harness_manager_report_card.py | tail -45 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Spiff impact (index §60): the share is of the P&L line the dollars actually book to; a profit lift is only reported from a profit; the un-wire lock on the four homes it dereferences; and a borrowed metric ranks through the peer bands' OWN median and gap"
        working-directory: backend
        run: python3 harness_spiff_impact.py | tail -45 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "This month's focus (index §63): the due list is computed and clears itself, a blank spiff rate is never $0, the declaration and the pay config are reconciled in BOTH directions, every play carries the number behind it, and 'market manager or above' is dereferenced from core.scope rather than copied a fourth time"
        working-directory: backend
        run: python3 harness_month_focus.py | tail -45 | tee -a "$GITHUB_STEP_SUMMARY"
      # Runs HERE and not in the dependency-free job because §I reads the router's own source to prove
      # the two endpoints dereference §5's homes rather than re-deriving them — and the module graph
      # names this lock, so a lock no workflow runs would fail the module-graph guard.
      - name: "Accessory target allocation (index §61): a goal nobody entered is not zero; zero attachment is weighted at the company rate and SAID, never given a $0 target; an unselected store's target is reserved out of the goal; the split foots to the dollar; and the un-wire lock on every home it dereferences"
