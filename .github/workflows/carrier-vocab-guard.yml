      - name: "Accessory target allocation (index §61): a goal nobody entered is not zero; zero attachment is weighted at the company rate and SAID, never given a $0 target; an unselected store's target is reserved out of the goal; the split foots to the dollar; and the un-wire lock on every home it dereferences"
