  # THE ONE-DOMAIN PROOF (index §40) loads the REAL next.config.ts through Next's own config loader, validates the
  # routes with Next's own loadCustomRoutes and evaluates requests with Next's own matchers: a production request on the
  # platform host is 308'd to the canonical site with its path and query; previews and localhost are untouched; the
  # /api/v1 and /health rewrites point at the backend; the CSP carries no backend host. It needs Next itself, so it
  # runs in its own job with the frontend's dependencies (Node 22 strips the TypeScript of the two homes natively).
  one-domain-proof:
    name: One-domain proof (the real next.config.ts through Next's own loader and matchers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install the frontend's dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the one-domain proof (canonical host 308; previews / localhost untouched; rewrites; CSP; the one home; negative controls)
        working-directory: frontend
        run: node prove_one_domain.mjs | tee -a "$GITHUB_STEP_SUMMARY"

