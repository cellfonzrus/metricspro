permissions:
  contents: read

concurrency:
  group: carrier-vocab-guard-${{ github.ref }}
  cancel-in-progress: true

# Every step runs under `bash -eo pipefail` (GitHub's explicit-bash shell). Without this, the default
# `bash -e` has NO pipefail, so `python3 harness_x.py | tee …` passed even when the harness failed — every lock
# here was silently unenforced until 2026-09-24. Locked by backend/harness_ci_pipefail_lock.py.
defaults:
  run:
    shell: bash

jobs:
  carrier-vocab-guard:
    name: No cross-side carrier vocabulary in page copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run carrier vocabulary guard (+ the POS vocabulary axis, index §26.10, + the setup-internals axis, §19.36, + the infra-names axis, §19.38)
        working-directory: backend
        run: python3 harness_carrier_vocab_guard.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Run the finance-expenses lock (one home for "expenses"; hub, drill-down, P&L and narrative dereference it)
        working-directory: backend
        run: python3 harness_account_expenses_one_home.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-kind lock (every upload surface reads the registry; no second list)
        working-directory: backend
        run: python3 harness_report_kind_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the connector-scope lock (every connector surface reads the registry; mirror = seed; one neutral line; no second list)
        working-directory: backend
        run: python3 harness_connector_scope_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the mapping-key lock (one derivation per statement type; no literal mapping key)
        working-directory: backend
        run: python3 harness_mapping_key_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-links lock (one pairing implementation; the links and the inventory check call it)
        working-directory: backend
        run: python3 harness_report_links_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the landing-identity lock (every writer stamps the report kind; one consumers map; every surface says where)
        working-directory: backend
        run: python3 harness_landing_identity_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the line-class lock (one activation-type predicate; one rules home; every caller dereferences it)
        working-directory: backend
        run: python3 harness_line_class_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the activation-event lock (one definition of an activation / upgrade; every pay and count surface dereferences it — index §6f)
        working-directory: backend
        run: python3 harness_activation_event_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the activation-bucketing proof (the Activation-Details classifier and its org-scoped rules loader — index §19.25c)
        working-directory: backend
        run: python3 harness_activation_bucketing.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the multi-month offer lock (multi-month is offered only through the one predicate; money is never hidden — index §6h)
        working-directory: backend
        run: python3 harness_multimonth_offer_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the payout-audience lock (one paid-line predicate, one employee allow-list, one manager-only registry the nav reads; no employee surface carries carrier commission — index §6i / §6j)
        working-directory: backend
        run: python3 harness_payout_audience_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the Exec-MTD device-rate lock (one device classifier, one category list, every consumer wired — index §6n)
        working-directory: backend
        run: python3 harness_exec_mtd_device_rates_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the tender-vocab lock (one tender vocabulary; every classifier dereferences it)
        working-directory: backend
        run: python3 harness_tender_vocab_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the P&L-commission-source lock (one resolver; the ledger booking dereferences the registry; a derived suppression set; one sum; every surface wired)
        working-directory: backend
        run: python3 harness_pl_commission_source_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the P&L month-range lock (a multi-month P&L loops THE single-month read; it computes no line; no second range path — index §4c)
        working-directory: backend
        run: python3 harness_pl_range_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      # index §4a / §4a.1 / §4a.2 — the MA money, the month-of-life LEG and the ladder's RUNG
      # convention each have ONE home. These locks shipped with #270/#272 but were never wired into
      # CI, so nothing failed the build when a caller stopped dereferencing them. Wiring them is the
      # "lock it so it cannot un-wire" half of the design-fix rule; both are stdlib-only and DB-free.
      - name: Run the MA one-home guard (MA income · the month LEG · the ladder RUNG convention)
        working-directory: backend
        run: python3 harness_ma_income_one_home_guard.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the month-of-life column proof (data-driven rungs; August 2026 split pinned)
        working-directory: backend
        run: python3 harness_ma_month_columns.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      # index §7b — the raw_mi residual's STORE GRAIN (owner 2026-10-01). Proves the re-grain conserves
      # the money to the cent against the REAL engine._assemble, reproduces the reported $0-per-store
      # defect as a regression, and FAILS THE BUILD if coa stops dereferencing the one door→store home
      # or a new private salesforce_id→store join appears. Stdlib only, DB-free.
      - name: Run the residual store-grain proof (one door→store home; consolidated total unmoved; the $0-per-store regression)
        working-directory: backend
        run: python3 harness_mi_residual_store_grain.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the any-subset-columns lock (no column-block ladder anywhere; one reading rule; every named reader on it; credential rows projected)
        working-directory: backend
        run: python3 harness_any_columns_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the POS sales-from-reports lock (one receipt document shape, one importer, one renderer; the format follows the declared POS)
        working-directory: backend
        run: python3 harness_pos_sales_from_reports_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the customer-master lock (one matcher, one decision, one phone rule, one placeholder home, one line writer — index §30.16)
        working-directory: backend
        run: python3 harness_customer_master_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the POS product-filters lock (one filter helper behind GET /pos/products; one filter component on both POS product screens; one spelling of the params — index §33)
        working-directory: backend
        run: python3 harness_pos_product_filters_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the ledger statement-identity lock (one identity derivation, one period home, one lander; every ledger read on the family; N landings refused — index §30.15)
        working-directory: backend
        run: python3 harness_ledger_identity_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the inventory-integrity lock (one engine; every serial landing asks the duplicate guard; one status writer with its ledger row; one IMEI key; the commission feed one registry fact — index §11b)
        working-directory: backend
        run: python3 harness_inventory_integrity_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the multi-month ledger upload lock (the batch is N single imports — one reader/mapper, one lander, one month detector, one canonicaliser — index §30.17)
        working-directory: backend
        run: python3 harness_ledger_batch_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the vendor price-compare proof (price / pack / stock reading, cross-vendor matching, cheapest in stock; no vendor or password in code; the crawler refuses cart / order links — index §34)
        working-directory: backend
        run: python3 harness_vendor_price_compare.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the supply sweep login lock (the scheduled catalog read signs in through the vendor's own login recipe — the one VendorScraper.login — never a second generic driver; index §36)
        working-directory: backend
        run: python3 harness_supply_sweep_login.py | tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the supply favourites / minimum-order lock (a per-each price is never a pack; same size at a different board strength never matches; the cart's one quantity rule honours the vendor minimum; the favourites list is the comparison filtered; a green login never keeps the last failure's sentence — index §36 / §41a)
        working-directory: backend
        run: python3 harness_supply_favorites_moq.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the tenant-vertical lock (one business-type declaration; every module / page / route / carrier gate asks it; mirror = seed; no vertical spelled in code — index §35)
        working-directory: backend
        run: python3 harness_tenant_vertical.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the Super Admin Toolbox lock (platform-only tiles are copies with a real home and a real route; one gate reads super_admin, never modules.admin; every NAV consumer asks platformOK or reads TENANT_NAV — index §38)
        working-directory: backend
        run: python3 harness_super_admin_toolbox.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the roles module-catalog lock (the Roles UI's module checkboxes are DERIVED from NAV — no second list; the report-area gate is named on screen, never silent — index §44)
        working-directory: backend
        run: python3 harness_roles_module_catalog.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the screen-link guard (every screen a link promises exists; a carrier/POS gate comes with a super-admin re-grant path — index §45)
        working-directory: backend
        run: python3 harness_screen_link_guard.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the DM-Verify range-cost lock (a full month is served; no org-level lookup sits in the per-date loop — index §46)
        working-directory: backend
        run: python3 harness_dm_verify_range_cost.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the envelope-receipt basis + counted-by lock (one basis vocabulary dereferenced from deposit_recon; the counter is the real actor shown as a person — index §47)
        working-directory: backend
        run: python3 harness_envelope_receipt_basis.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the five-stage accountability chain lock (each stage read from its own home; the spine makes "not done" visible — index §48)
        working-directory: backend
        run: python3 harness_accountability_chain.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the closing closer-pick lock (the closing is submitted under the signed-in person; DM and above may pick; the server refuses otherwise; screen mirror = server rule — index §29.7)
        working-directory: backend
        run: python3 harness_closing_closer_pick.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the closing config active lock (a switched-off tender / count is gone from the form and every recon, and the editors can switch one off — index §29.9)
        working-directory: backend
        run: python3 harness_closing_config_active.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the acting-org default lock (no page seeds its organisation from the house org — index §29.8)
        working-directory: backend
        run: python3 harness_acting_org_default.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the Paramount KPI column lock (one exact column table; an unknown header yields no value, never the neighbour's; the import writes every key it parsed — index §19.20)
        working-directory: backend
        run: python3 harness_paramount_kpi_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the KPI registry lock (one built-in KPI set; one rep-grain AND store-grain feed map; the PAID score, the SHOWN score and the hand-entry grid read them; no fabricated zero, no fabricated denominator, each DLAR grain carries its own as-of date — index §19.27 / §19.28)
        working-directory: backend
        run: python3 harness_kpi_registry_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the Ready App denominator proof (ONE new-activation count = Exec MTD Total Activation less Upgrade less swap; the carrier reconciliation 8/13; the derived rate resolved at score time; house pay byte-identical until the basis column is set — owner 2026-09-27, index §19.31)
        working-directory: backend
        run: python3 harness_ready_app_denominator.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the feed-vs-transactions proof (every difference attributed to a counting definition, held undecidable behind a stale slice, or reported as the finding; absence is never zero on either side — owner 2026-09-27, index §19.31)
        working-directory: backend
        run: python3 harness_dlar_vs_platform.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the port-out fraud proof (a port-in that ports out inside the window; the three dating bases; a port-out BEFORE our sale is a recycled number and is never flagged; a port-out in an earlier month is not lost to the latest snapshot; the headline prints what it could not decide; the accessory floor is an attribution, not a trigger; the lookup is the retention report's own derivation — owner 2026-09-28, index §19.32)
        working-directory: backend
        run: python3 harness_portout_fraud.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the table-sort ratchet (a new data table cannot ship unsorted; the unsorted list only shrinks — owner 2026-08-10, index §19.29)
        working-directory: backend
        run: python3 harness_table_sort_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the supply-ordering proof (vendor setup incl. free-shipping threshold + delivery days; catalog ingest; the cart optimizer with thresholds / lead time / stock / packs; the order recipe never submits on its own; confirmation capture; one lander, one connector key, one pricing copy — index §36)
        working-directory: backend
        run: python3 harness_supply_ordering.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the browser-work lock (the declared browser sweeps + every module outside commcalc that launches a browser equal what the code does; browser endpoints require the browser service — index §19.23a / §36)
        working-directory: backend
        run: python3 harness_browser_sweep_kinds.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the one-domain lock (only src/lib/apiBase.ts reads where the backend / site is; no platform hostname in the app source; next.config installs the proxy rewrites, the canonical-host redirect and the derived connect-src from the homes; every browser-launching endpoint is DIRECT — index §40)
        working-directory: backend
        run: python3 harness_one_domain_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the CORS policy proof (config not code; the app's own origin always allowed; no wildcard; an allow-regex that admits a registrable host is refused — index §40)
        working-directory: backend
        run: python3 harness_cors_policy.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the franchise royalty proof (synthetic report from text + HTML; the rounding remainder; flags kept, never corrected; P&L mapping; recon; centers; the vertical axis — index §37)
        working-directory: backend
        shell: bash
        run: python3 harness_royalty.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the franchise royalty lock (one vocabulary, one rounding rule, one booking path, the vertical as data, org-scoped, gated, one engine — index §37)
        working-directory: backend
        shell: bash
        run: python3 harness_royalty_lock.py | tee -a "$GITHUB_STEP_SUMMARY"

  # THE ONE-DOMAIN PROOF (index §40) loads the REAL next.config.ts through Next's own config loader, validates the
  # routes with Next's own loadCustomRoutes and evaluates requests with Next's own matchers: a production request on the
  # platform host is 308'd to the canonical site with its path and query; previews and localhost are untouched; the
  # /api/v1 and /health rewrites point at the backend; the CSP carries no backend host. It needs Next itself, so it
  # runs in its own job with the frontend's dependencies (Node 22 strips the TypeScript of the two homes natively).
  one-domain-proof:
    name: One-domain proof (the real next.config.ts through Next's own loader and matchers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install the frontend's dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the one-domain proof (canonical host 308; previews / localhost untouched; rewrites; CSP; the one home; negative controls)
        working-directory: frontend
        run: node prove_one_domain.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # THE CUSTOMER-MASTER PROOF (index §30.16) drives the REAL matcher, rebuild, line writer and /pos endpoints over the
  # in-memory client (harness_intake_fakes) — it imports the app, so it runs in its own job with the backend's
  # dependencies installed (the guard job above stays dependency-free). DB-free; no network beyond pip.
  customer-master-proof:
    name: Customer master proof (DB-free, the real functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the customer-master proof (one matcher; a line per phone number with its device and plan; what the customer paid; reversible merges; safe before mig 1017)
        working-directory: backend
        run: python3 harness_customer_master.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      # These two import the app (FastAPI) — they run here, where the backend's dependencies are installed. In the
      # dependency-free guard job they crashed on every run, and the missing pipefail hid it (index §19.25).
      - name: Run the line-class proof (the money compatibility pin + the suggestion engine over the measured vocabulary)
        working-directory: backend
        run: python3 harness_line_class.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the activation-event proof (pay per activation / upgrade, not per line — the owner's invoice $30 → $10; byte-identity of the house count unit — index §6f)
        working-directory: backend
        run: python3 harness_activation_event.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the KPI vintage / honest-denominator / registry pay-engine proof (the owner's 4-vs-7; a KPI with no basis is no_data, never a failed zero; the count reconciliation to the carrier; HOUSE pay byte-identical — index §19.28)
        working-directory: backend
        run: python3 harness_kpi_vintage.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the rep-incentive month-range proof (every month of a range == that month viewed alone; one month enumeration; the cap — index §6g)
        working-directory: backend
        run: python3 harness_rep_incentive_range.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the multi-month offer proof (configured / off / off-with-money; the R1 guard unchanged; the status endpoint — index §6h)
        working-directory: backend
        run: python3 harness_multimonth_offer.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the payout-audience proof (employee sees the paid line with its sale, no carrier $; manager full; own-rep 403; the one-employee month range == its single statements — index §6i / §6j)
        working-directory: backend
        run: python3 harness_payout_audience.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the one-rep recompute end-to-end proof (runs the handler; writes only that rep's row == the full run's; no ledger write — index §6k)
        working-directory: backend
        run: python3 harness_recompute_rep_e2e.py | tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the Exec-MTD device-rate proof (tablet / watch per event at their own rate; no device config = byte-identical — index §6n)
        working-directory: backend
        run: python3 harness_exec_mtd_device_rates.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the single-assignment remover proof (one row of one plan of one org; cross-org / cross-plan 404 with zero writes — index §6n)
        working-directory: backend
        run: python3 harness_plan_assignment_remove.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the recompute-rep parity proof (one plan resolution, reached through the full path — index §6c / §6k)
        working-directory: backend
        run: python3 harness_recompute_rep_parity.py | tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the auto-calc-on-landing proof (three real landers → ONE Run Calculation == the manual one; burst, late month, refusal recorded, config off, org-scoped, pre-1030 fallback — index §6l)
        working-directory: backend
        run: python3 harness_auto_calc_on_landing.py | grep -v -E '^(INFO|DEBUG|WARN) ' | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the plan-sources lock (one registry of plan-name sources; one resolver for preview and apply; one writer; the card seeds from the proposal; no vendor)
        working-directory: backend
        run: python3 harness_plan_sources_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      # index §33 — the POS product filters over the REAL handler (same in-memory pattern, same deps).
      - name: Run the POS product-filters proof (each filter narrows; they combine with search; no new param = the old answer; in stock; past the 500 cap; org-scoped)
        working-directory: backend
        run: python3 harness_pos_product_filters.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE CLOSING FILTER CONTRACT (index §29.10) imports closing/router.py (FastAPI), so it cannot run in the bare-Python
  # job above — it failed there with "No module named 'fastapi'" from the day it landed (#311, red on main). Its own job,
  # with the backend's dependencies, like the proofs below.
  closing-filter-contract-proof:
    name: Closing filter contract (imports the closing router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the closing filter contract (three standard filters, three resolvers; an accepted filter is an applied filter — owner 2026-09-26, index §29.10)
        working-directory: backend
        shell: bash
        run: python3 harness_closing_filter_contract.py | tee -a "$GITHUB_STEP_SUMMARY"

  # THE STORE-IDENTITY PROOF (index §13d) drives the REAL account.coa.store_resolver over an in-memory client seeded with
  # the live house row shapes, plus the REAL account.store_identity_audit. It fails the build if one physical store's
  # spellings stop collapsing to ONE canonical key — the B-1800 / B-1115 split the owner reported on 2026-10-02, whose
  # cause is a store_mapping row with no real address (or none at all). Imports the app, so it takes the backend's
  # dependencies. DB-free (_harness_dbfree tripwire).
  store-identity-proof:
    name: Store identity — one store, one canonical key (DB-free, the real resolver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the store-identity proof (the live split reproduced; the runbook's three rows collapse every spelling to one key; undo any one repair and the finding returns — index §13d)
        working-directory: backend
        shell: bash
        run: python3 harness_store_mapping_identity.py | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE CLOSING-REFUSAL LOCK (index §29.11, owner bug report 2026-10-02 "we cannot see the daily closing which was
  # submitted"). A daily closing that is REFUSED used to store nothing at all — not even in commcalc.closing_attempt,
  # the submit audit trail — so "I submitted it" versus "we see nothing" was unresolvable for any store, rep or tenant.
  # Every refusal now goes through closing/router._refuse into that same table, with its reason declared once in
  # closing/submit_refusal.REFUSALS; the dedup key has one home (closing/dedup_key, whose SQL_EXPR migration 1037 must
  # contain verbatim). This job FAILS THE BUILD if a submit validation raises HTTPException directly, if a code is
  # raised that the registry does not declare (or declared and never raised), if the router starts spelling a dedup key
  # of its own, if the try counter stops dereferencing _real_attempt_count, if the migration's SQL drifts from the
  # module, or if the Management Review screen has no words for a code. It imports the closing router (FastAPI), so it
  # needs the backend's dependencies — same reason as the job above. DB-free.
  closing-refusal-lock:
    name: Closing refusal lock (a refused closing leaves a record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the closing-refusal lock (every refusal recorded with its reason; a refusal is not a try; one dedup-key formula — index §29.11)
        working-directory: backend
        shell: bash
        run: python3 harness_closing_submit_refusal.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE SETUP-DOCUMENTS PROOF (index §39) imports the real setup_documents / setup_router / import_health modules (the
  # document rules, automation history, gate, reminders, the super-admin edit validation), so it runs in its own job with
  # the backend's dependencies, like the proofs below. DB-free.
  setup-documents-proof:
    name: Setup documents proof (DB-free, the real functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the setup-documents lock (per-carrier required uploads from the registry; automation offered only on a proven track record; the wizard gate; one reminder per cycle through the alert pipeline — index §39)
        working-directory: backend
        shell: bash
        run: python3 harness_setup_documents.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE BASE-URL LOCK (index §41) drives the REAL browser_service_url(), the REAL proxy handler in app.main and the REAL
  # Settings, so it needs the backend's dependencies. It fails the build if an operator-typed service address stops going
  # through the one normaliser (app/core/base_url.py) or a second reader of BROWSER_SERVICE_URL appears. DB-free.
  base-url-proof:
    name: Service address lock (DB-free, the real functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the base-URL lock (an address pasted without https:// still works; one reader of BROWSER_SERVICE_URL; every *_URL setting normalised)
        working-directory: backend
        shell: bash
        run: python3 harness_base_url.py | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE INVENTORY-INTEGRITY PROOF (index §11b) drives the REAL engine, landing guard, status writer and /pos endpoints over
  # the in-memory client (harness_intake_fakes) with the anonymised 383-unit regression fixture — it imports the app, so it
  # runs in its own job with the backend's dependencies installed, like the customer-master proof. DB-free.
  inventory-integrity-proof:
    name: Inventory integrity proof (DB-free, the real functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the inventory-integrity proof (sales lines + commission report; flags, one-click assign, verify; the 409 guard on every landing path; the ledger on every status change)
        working-directory: backend
        run: python3 harness_inventory_integrity.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE MULTI-MONTH LEDGER UPLOAD PROOF (index §30.17) drives the REAL /commission-ledger/import and /import-batch
  # endpoints over the in-memory client (harness_intake_fakes): N files through the batch land byte-identical
  # ledger rows to N single imports; one month twice, an undeterminable month and differing columns are refused;
  # an already-landed month follows the lander's replace rule; one file's failure rolls back no other. It imports
  # the app, so it runs in its own job with the backend's dependencies.
  ledger-batch-proof:
    name: Multi-month ledger upload proof (DB-free, the real endpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the multi-month ledger upload proof (batch == N single imports; refusals; replace rule; per-file isolation)
        working-directory: backend
        run: python3 harness_ledger_batch.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE SWEEP-FAILURE VISIBILITY PROOF (index §43) drives the REAL app/core/import_batches reaper decision and
  # reads the connector-health predicate out of the commcalc router: a batch a dead run stranded in `parsing` is
  # reaped (a `finally` cannot do it — the process was killed), reaping releases the partial unique index so the
  # same file can be re-imported, and a `partial` sweep status counts as a failure while `skipped` does not.
  # It imports app.core.import_batches, which imports the Supabase client, so it runs in its own job with the
  # backend's dependencies — NOT in carrier-vocab-guard, which installs nothing
  # (harness_ci_pipefail_lock.py fails the build if this step moves back).
  sweep-failure-visibility-proof:
    name: Sweep-failure visibility proof (DB-free, the real reaper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the sweep-failure visibility proof (a dead parse is reaped, reaping releases the retry, a partial delivery is a failure — index §43)
        working-directory: backend
        run: python3 harness_sweep_failures_visible.py | tee -a "$GITHUB_STEP_SUMMARY"

  # THE FRANCHISE ROYALTY P&L PROOF (index §37) drives the REAL coa.build_inputs / engine._assemble / statement_engine /
  # statement_filter / royalty router over an in-memory client: the house org's P&L is byte-identical to the frozen
  # pre-change oracle (commit 2f2bdfd), the royalty report books its heads at the store its profit center names, the
  # unclaimed sale line is reported and never double-counts the report, a profit center is a scope of the one engine,
  # the filter fails closed. It imports the app, so it runs in its own job with the backend's dependencies.
  finance-royalty-proof:
    name: Franchise royalty P&L proof (DB-free, the real engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the franchise royalty P&L proof (house byte-identity; booking; suppression; scopes; filter; router; the multi-month upload = N single imports — index §37.10)
        working-directory: backend
        shell: bash
        run: python3 harness_royalty_pl.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
      # index §4c — the P&L over a month range drives the REAL account router (pl_single_month / get_pl_range),
      # statement_filter and the notify registry + renderer over an in-memory client; it imports the app, so it
      # runs here with the backend's dependencies.
      - name: Run the P&L month-range proof (every month column == that month's P&L to the cent; Total == Σ months; absence blank; org-isolated; the scheduled report and the xlsx renderer)
        working-directory: backend
        run: python3 harness_pl_range.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
      # index §42 — the owner's 2026-09-29 device-cost report. Drives the REAL device_cogs.resolve over an
      # in-memory consignment ledger: the config row is the whole of "not coming in boost"; an unsold unit is in no
      # month's COGS and the same unit lands in the month it sells, exactly once; the periodic-inventory identity
      # closes over the ledger's own columns; the cash-basis line would double-count. It imports the app, so it
      # runs here with the backend's dependencies.
      - name: Run the device inventory→COGS proof (unsold sits, sold moves, once; the identity closes; the cash line double-counts — index §42)
        working-directory: backend
        run: python3 harness_device_inventory_cogs.py | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
