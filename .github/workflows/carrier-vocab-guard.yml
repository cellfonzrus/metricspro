        shell: bash
        run: python3 harness_closing_submit_refusal.py | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"

  # THE STORE-DAY GRAIN LOCK (index §29.13, owner bug report 2026-10-13 "2 reps did the closing for Oct 10 for
  # nostrand ave ... the system should not have taken duplicate entries"). The platform had exactly ONE answer to
