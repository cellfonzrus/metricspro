name: carrier-vocab-guard

# Carrier vocabulary guard (owner directive 2026-09-04). A tenant must only ever see its own
# carrier's vocabulary: no "VidaPay / T-CETRA / Total Wireless / MA …" wording on the Boost side,
# no "Boost / VIP / ACIMA / PayGo / ePay / Asset Ledger" wording on the Total side. The durable
# mechanism is the mig-945/953 carrier label preset system (report_col/report_banner/report_term
# scopes resolved by report_labels.py + lib/report-labels.ts) and the NAV_CARRIERS gate in
# lib/rbac.ts. This job FAILS the build when frontend display copy hardcodes a cross-side carrier
# term outside a NAV-gated page or the guard's pinned, reviewed exceptions.
#
# THE FINANCE EXPENSES LOCK (index §4, 2026-09-21) runs in the same job: "expenses for a scope and
# period" has ONE home — `account/analysis.pl_totals` over `analysis.EXPENSE_SECTIONS` — and the Account
# hub's Expenses column, the drill-down, the P&L and the narrative all dereference it. A caller that
# starts summing the statement sections itself, a NEW below-gross-profit section missing from that
# tuple, or a frontend mirror that drifts from it, fails the build
# (backend/harness_account_expenses_one_home.py; stdlib only).
#
# Dependency-free: the guard statically scans frontend/src on bare Python — no pip install.
#
# THE REPORT-KIND LOCK (design §7, 2026-09-20) runs in the same job: every upload surface must read
# the report-kind registry through the one hook, and no second list of report kinds / filename
# patterns / POS vendor names may exist in code (backend/harness_report_kind_lock.py; stdlib only).
#
# THE MAPPING-KEY LOCK (index §30.10, 2026-09-20) runs here too: a commission-family column-mapping
# key is DERIVED per statement type by ONE function (commission_ledger.mapping_report_key); a literal
# 'commission_ledger' used as a mapping key anywhere outside the allow set fails the build
# (backend/harness_mapping_key_lock.py; stdlib only).
#
# THE POS VOCABULARY AXIS (index §26.10, 2026-09-20) runs inside the guard itself: the POS vendor names
# are DERIVED from the seeds (report_term pos_system, pos_profile, HOUSE_KINDS.applies_to_pos) and may
# not appear in frontend copy, as a bare literal in a page, in the backend payload modules' strings or
# in the registry / intake / spine logic (the class folded out of harness_report_kind_lock.py).
#
# THE LANDING-IDENTITY LOCK (index §32, 2026-09-20) runs here too: every writer to a table more than one
# report kind can land in STAMPS the kind (landing_identity.KIND_STAMP) and scopes its replace by it; ONE
# consumers map says where an upload shows up and every upload surface renders it through ShowsIn; a
# second copy, an unstamped writer or a surface that stops saying where fails the build
# (backend/harness_landing_identity_lock.py; stdlib only).
#
# THE LINE-CLASS LOCK (index §3 / §30.12, 2026-09-21) runs here too: a sale line's activation type has ONE
# predicate (commcalc/line_class.activation_class) and ONE per-org rules home
# (accessory_config.activation_details_rules); every classifier dereferences it, no second token list,
# the 2.5a intake step writes only through the two config writers, the Exec MTD page renders the
# "no line could be told apart" way-back (backend/harness_line_class_lock.py + harness_line_class.py, the
# money compatibility pin; stdlib only).
#
# THE TENDER-VOCAB LOCK (index §30.13, 2026-09-21) runs here too: the tender classes have ONE home
# (closing.router.TENDER_VOCAB, from which the closing axis is derived, and the one ladder tender_class);
# the intake's tender-column step spells no tender word (its classifiers are injected), every other tender
# word list is a NAMED pre-existing sibling, and the Stage-4 tender split rides the closing recon's own
# reader (backend/harness_tender_vocab_lock.py; stdlib only). The sales-by-invoice PROOF
# (backend/harness_sales_by_invoice.py: the 41-header fixture end to end over the real router) runs
# locally like the other intake proofs — it needs the app's dependencies.
#
# THE P&L-COMMISSION-SOURCE LOCK (index §4b, mig 1013, 2026-09-21) runs here too: which source books the
# P&L's commission lines has ONE resolver (account/ledger_pnl.resolve_source), the ledger booking
# dereferences the bucket registry's pl_line_key through the ledger's own summarizer (no bucket → line
# map, no second sum over ledger rows outside the commission module), the feed-suppression set is DERIVED,
# every commission-feed path in coa.build_inputs goes through the guarded adder, and every surface (the
# P&L drill-down, ShowsIn, the one settings panel with its one writer) renders the one answer
# (backend/harness_pl_commission_source_lock.py; stdlib only). The money PROOF
# (backend/harness_pl_commission_source.py: the compatibility pin, the booking, the guard, the divergence)
# runs locally like the other P&L proofs — it needs the app's dependencies.
#
# THE ANY-SUBSET-COLUMNS LOCK (index §4b.1, 2026-09-22) runs here too: a reader of a table whose columns
# arrive by hand-applied migrations tolerates ANY subset of them — no column-block ladder anywhere under
# backend/app (one missing OLDER column hid every NEWER one: the live P&L read `feeds` after the owner
# chose the ledger), ONE reading rule (core/column_tolerant.py) every named reader dereferences, the
# credential-holding rows projected (backend/harness_any_columns_lock.py; stdlib only). The PROOF
# (backend/harness_any_columns.py: the live shape and its inverse, byte-identical under complete columns)
# runs locally like the other P&L proofs.
#
# THE CONNECTOR-SCOPE LOCK (index §12a.2, mig 1014, 2026-09-21) runs here too: connectors carry a POS /
# carrier scope in ONE registry (commcalc.connector_registry, mirror connector_registry.HOUSE_CONNECTORS —
# parsed back from the seed), visibility is report_kinds' predicate one axis over (the `connector:` cap
# namespace), every connector surface (frontend and backend) dereferences it, the ONE neutral line has two
# homes pinned equal, no page keeps a connector list, and the connector modules' copy spells no vendor
# (the #262 seam, closed in the guard's POS axis) — backend/harness_connector_scope_lock.py; stdlib only.
#
# THE PLAN-SOURCES LOCK (index §23n, 2026-09-22) runs here too: which landed sources carry a tenant's
# plan names is ONE registry (core/plan_sources.HOUSE_SOURCES) resolved over per-org config (pos.pos_settings
# `plan_sources`, mig 725); ONE resolver (onboarding.resolve_service_plans) serves preview AND apply; the
# rules are written through ONE writer (pos.router.upsert_pos_setting) after the too-broad guard; the
# wizard card lists the sources from the payload and seeds its words from the proposal only; no carrier
# or POS vendor word in the module or the card (backend/harness_plan_sources_lock.py; stdlib only).
#
# THE REPORT-LINKS LOCK (index §30.11, 2026-09-20) runs here too: ONE device / phone-number pairing
# implementation (inventory_sold_recon.line_pairings, folded by activation_index, called by
# report_links) with the key normalisers in their homes; a second copy anywhere in commcalc, or a
# link reader that stops calling the core, fails the build (backend/harness_report_links_lock.py;
# stdlib only).
#
# THE LEDGER STATEMENT-IDENTITY LOCK (index §30.15, 2026-09-22) runs here too: a commission statement's
# ledger key is derived ONCE (commission_ledger.ledger_source_report — the intake, the older wizard and
# the MA refresh all land through router._ledger_land_rows, the ONE lander), its period is stored in ONE
# spelling (account/_period.canonical_period), every ledger read filters the statement's FAMILY and every
# period spelling through router._ledger_query, and more than one landing of one statement × period is
# REFUSED by every summing reader — a literal-filtered ledger read, a second lander, a second key
# composition or an un-wired guard fails the build (backend/harness_ledger_identity_lock.py; stdlib only).

