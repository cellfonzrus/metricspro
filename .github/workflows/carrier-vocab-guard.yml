  # unique index built from it, and in create_row's pre-insert guard — so a second PERSON was a duplicate to none of
  # them and the day's declared cash doubled into every downstream total in silence (Nostrand / 2026-10-10 held three
  # accepted closings, $370 against a POS day of $140). closing/closing_grain is now the one home for how many
  # closings a store-day takes, per-org config with a per-store override and a house default of one-per-store-day.
  # This job FAILS THE BUILD if create_row stops dereferencing it, if the dedup key is composed without the grain, if
  # the closing-sheet upload (the second writer of daily_closing) stops asking the same question, if a second copy of
  # the vocabulary appears, if migration 1080 starts recomputing stored dedup keys (which would collide on the 16
  # historical two-rep store-days), or if the Management Review screen has no words for the new refusal. It drives the
  # real submit endpoint and the real sheet ingest against the shared in-memory client, so it needs the backend's
  # dependencies — same reason as the job above. DB-free.
  closing-store-day-grain-lock:
    name: Closing store-day grain lock (one store-day, one closing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install the backend's dependencies
        run: pip install -r backend/requirements.txt
