name: carrier-vocab-guard

# Carrier vocabulary guard (owner directive 2026-09-04). A tenant must only ever see its own
# carrier's vocabulary: no "VidaPay / T-CETRA / Total Wireless / MA …" wording on the Boost side,
# no "Boost / VIP / ACIMA / PayGo / ePay / Asset Ledger" wording on the Total side. The durable
# mechanism is the mig-945/953 carrier label preset system (report_col/report_banner/report_term
# scopes resolved by report_labels.py + lib/report-labels.ts) and the NAV_CARRIERS gate in
# lib/rbac.ts. This job FAILS the build when frontend display copy hardcodes a cross-side carrier
# term outside a NAV-gated page or the guard's pinned, reviewed exceptions.
#
# Dependency-free: the guard statically scans frontend/src on bare Python — no pip install.
#
# THE REPORT-KIND LOCK (design §7, 2026-09-20) runs in the same job: every upload surface must read
# the report-kind registry through the one hook, and no second list of report kinds / filename
# patterns / POS vendor names may exist in code (backend/harness_report_kind_lock.py; stdlib only).
#
# THE MAPPING-KEY LOCK (index §30.10, 2026-09-20) runs here too: a commission-family column-mapping
# key is DERIVED per statement type by ONE function (commission_ledger.mapping_report_key); a literal
# 'commission_ledger' used as a mapping key anywhere outside the allow set fails the build
# (backend/harness_mapping_key_lock.py; stdlib only).
#
# THE POS VOCABULARY AXIS (index §26.10, 2026-09-20) runs inside the guard itself: the POS vendor names
# are DERIVED from the seeds (report_term pos_system, pos_profile, HOUSE_KINDS.applies_to_pos) and may
# not appear in frontend copy, as a bare literal in a page, in the backend payload modules' strings or
# in the registry / intake / spine logic (the class folded out of harness_report_kind_lock.py).
#
# THE REPORT-LINKS LOCK (index §30.11, 2026-09-20) runs here too: ONE device / phone-number pairing
# implementation (inventory_sold_recon.line_pairings, folded by activation_index, called by
# report_links) with the key normalisers in their homes; a second copy anywhere in commcalc, or a
# link reader that stops calling the core, fails the build (backend/harness_report_links_lock.py;
# stdlib only).

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "backend/harness_carrier_vocab_guard.py"
      - "backend/harness_report_kind_lock.py"
      - "backend/harness_mapping_key_lock.py"
      - "backend/harness_report_links_lock.py"
      - "backend/app/modules/commcalc/report_links.py"
      - "backend/app/modules/commcalc/inventory_sold_recon.py"
      - "backend/app/modules/commcalc/device_cost_recon.py"
      - "backend/app/modules/commcalc/report_kinds.py"
      - "backend/app/modules/commcalc/column_mapping.py"
      - "backend/app/modules/commcalc/commission_ledger.py"
      - "backend/app/modules/commcalc/onboarding_intake.py"
      - "backend/app/modules/commcalc/implementation_spine.py"
      - "backend/app/modules/commcalc/router.py"
      - "backend/app/modules/commcalc/report_labels.py"
      - "backend/app/modules/commcalc/sales_recon.py"
      - "backend/app/modules/commcalc/imei_rebate_report.py"
      - "backend/app/modules/closing/router.py"
      - "backend/app/modules/closing/attention_providers.py"
      - "backend/app/modules/asset/router.py"
      - "backend/app/modules/account/finance_attention.py"
      - "backend/app/modules/core/onboarding.py"
      - "database/migrations/1010_report_kind_registry.sql"
      - "database/migrations/200_commission_b2bsoft_pos_profile.sql"
      - "database/migrations/953_carrier_vocabulary_term_presets.sql"
      - "database/migrations/1004_pos_feed_shape_ingest.sql"
      - ".github/workflows/carrier-vocab-guard.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "backend/app/modules/commcalc/report_kinds.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carrier-vocab-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carrier-vocab-guard:
    name: No cross-side carrier vocabulary in page copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run carrier vocabulary guard (+ the POS vocabulary axis, index §26.10)
        working-directory: backend
        run: python3 harness_carrier_vocab_guard.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Run the report-kind lock (every upload surface reads the registry; no second list)
        working-directory: backend
        run: python3 harness_report_kind_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the mapping-key lock (one derivation per statement type; no literal mapping key)
        working-directory: backend
        run: python3 harness_mapping_key_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the report-links lock (one pairing implementation; the links and the inventory check call it)
        working-directory: backend
        run: python3 harness_report_links_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
