      - "frontend/src/components/DrillDownPanel.tsx"
      - "frontend/src/app/(platform)/closing/tender-recon/page.tsx"
      - "frontend/src/app/(platform)/closing/_lib/DrillStat.tsx"
      # §CORE-17.3e — the 3-way selection strip and the cash-pickup footers.
