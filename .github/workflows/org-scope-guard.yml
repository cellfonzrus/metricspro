name: org-scope-guard

# Org-scope guard (audit fix #3, owner 2026-08-30). Every commcalc table ships with `open_all` RLS —
# the database does NOT isolate tenants, so isolation depends entirely on the application carrying an
# org_id scope on every query. Until real RLS is validated against a live DB, this job is the safety
# net: it FAILS the build if a query on a money/sales table (rep_commissions, raw_sales, commission_plan,
# carrier_commission, …) reads rows or mutates without an org_id filter — the cross-tenant leak class.
#
# Dependency-free: the guard imports nothing from the app, it statically scans the router source, so it
# runs on bare Python in seconds with no pip install.

on:
  pull_request:
    paths:
      - "backend/app/modules/commcalc/router.py"
      - "backend/harness_org_scope_guard.py"
      - "backend/app/modules/pos/inventory_integrity_router.py"
      - "backend/app/modules/supply/**"
      - ".github/workflows/org-scope-guard.yml"
      # the undefined-name lock (index §6k) judges EVERY module under backend/app
      - "backend/app/**/*.py"
      - "backend/harness_undefined_names_lock.py"
      # the auto-calc-on-landing lock (index §6l) — every lander under backend/app, the index, the page, the CI
      - "backend/harness_auto_calc_lock.py"
      - "docs/SYSTEM_DATA_FLOW_INDEX.md"
      - "database/migrations/1030_auto_calc_on_landing.sql"
      - "frontend/src/app/(platform)/commcalc/**"
  push:
    branches: [main]
    paths:
      - "backend/app/modules/commcalc/router.py"
      - "backend/app/modules/pos/inventory_integrity_router.py"
      - "backend/app/modules/supply/**"
      - "backend/app/**/*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-scope-guard-${{ github.ref }}
  cancel-in-progress: true

# Every step runs under `bash -eo pipefail` (GitHub's explicit-bash shell). Without this, the default
# `bash -e` has NO pipefail, so `python3 harness_x.py | tee …` passed even when the harness failed — every lock
# here was silently unenforced until 2026-09-24. Locked by backend/harness_ci_pipefail_lock.py.
defaults:
  run:
    shell: bash

jobs:
  org-scope-guard:
    name: Sensitive queries are org-scoped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run org-scope guard
        working-directory: backend
        run: python3 harness_org_scope_guard.py | tee "$GITHUB_STEP_SUMMARY"

  undefined-names:
    # THE #244 CLASS (index §6k): a local moved into a helper strands a sibling that still reads it — a NameError
    # on every call that Python only finds when the line runs. stdlib `symtable`, no pip install: every scope of
    # every module under backend/app; a read name bound nowhere fails the build. Planted controls inside.
    name: No undefined names under backend/app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the undefined-name lock
        working-directory: backend
        run: python3 harness_undefined_names_lock.py | tee -a "$GITHUB_STEP_SUMMARY"

  auto-calc-lock:
    # AUTO-CALCULATION ON LANDING (owner 2026-09-28, index §6l): "data landed for org X, period P" has ONE home
    # (commcalc/auto_calc.py). Stdlib + ast, no pip install: every function under backend/app that writes a table
    # the Run Calculation reads must call auto_calc.landed(...) or be excused with a reason; nothing but the Run
    # Calculation button and the hook's runner may start _run_calculation; the runner keeps every guard armed;
    # the config has one reader; the registry covers what the calculation reads. Planted controls inside.
    name: One post-landing hook, one calculation trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the auto-calc-on-landing lock
        working-directory: backend
        run: python3 harness_auto_calc_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
