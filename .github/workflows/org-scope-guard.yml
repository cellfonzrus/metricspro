name: org-scope-guard

# Org-scope guard (audit fix #3, owner 2026-08-30). Every commcalc table ships with `open_all` RLS —
# the database does NOT isolate tenants, so isolation depends entirely on the application carrying an
# org_id scope on every query. Until real RLS is validated against a live DB, this job is the safety
# net: it FAILS the build if a query on a money/sales table (rep_commissions, raw_sales, commission_plan,
# carrier_commission, …) reads rows or mutates without an org_id filter — the cross-tenant leak class.
#
# Dependency-free: the guard imports nothing from the app, it statically scans the router source, so it
# runs on bare Python in seconds with no pip install.

on:
  pull_request:
    paths:
      - "backend/app/modules/commcalc/router.py"
      - "backend/harness_org_scope_guard.py"
      - "backend/app/modules/pos/inventory_integrity_router.py"
      - "backend/app/modules/supply/**"
      - ".github/workflows/org-scope-guard.yml"
      # the undefined-name lock (index §6k) judges EVERY module under backend/app
      - "backend/app/**/*.py"
      - "backend/harness_undefined_names_lock.py"
      # the paged-read lock (index §CORE-05) judges EVERY module under backend/app too
      - "backend/harness_feed_read_lock.py"
      - "backend/app/modules/core/feed_read.py"
      - "backend/app/modules/recovery/engine.py"
      # the auto-calc-on-landing lock (index §6l) — every lander under backend/app, the index, the page, the CI
      - "backend/harness_auto_calc_lock.py"
      - "docs/SYSTEM_DATA_FLOW_INDEX.md"
      - "database/migrations/1030_auto_calc_on_landing.sql"
      - "frontend/src/app/(platform)/commcalc/**"
      # the unique-numbers lock — every migration file and every index section number
      - "database/migrations/**"
      - "backend/harness_unique_numbers_lock.py"
      # the actor-uid lock (index §19.34) — every writer under backend/app, the migrations' column types,
      # the proofs that could stub the helper, and the frontend that could send a sentinel actor
      - "backend/harness_actor_uid_lock.py"
      - "backend/scratchpad/**"
      - "backend/harness_*.py"
      - "frontend/src/**"
      # the row-save lock (index §19.35) — its proof and ratchet live beside frontend/src
      - "frontend/prove_row_save.mjs"
      - "frontend/row_save_pending.txt"
      # the hub viewer gate (index §CORE-06) — the one home, its consumers, its lock and its proof
      - "frontend/src/lib/hub-gate.ts"
      - "backend/harness_hub_viewer_gate.py"
      - "frontend/scratchpad/prove_hub_gate.mjs"
      # assign-a-password is one home (index §CORE-09) — the component, its three consumers, the
      # Payroll hub's Manage Employees tile, the lock and the proof
      - "frontend/src/components/AssignPasswordCard.tsx"
      - "backend/harness_assign_password_one_home.py"
      - "frontend/scratchpad/prove_manage_employees_tile.mjs"
  push:
    branches: [main]
    paths:
      - "backend/app/modules/commcalc/router.py"
      - "backend/app/modules/pos/inventory_integrity_router.py"
      - "backend/app/modules/supply/**"
      - "backend/app/**/*.py"
      - "database/migrations/**"
      - "docs/SYSTEM_DATA_FLOW_INDEX.md"
      - "backend/harness_actor_uid_lock.py"
      - "frontend/src/**"
      - "frontend/prove_row_save.mjs"
      - "frontend/row_save_pending.txt"
      - "backend/harness_row_save_lock.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-scope-guard-${{ github.ref }}
  cancel-in-progress: true

# Every step runs under `bash -eo pipefail` (GitHub's explicit-bash shell). Without this, the default
# `bash -e` has NO pipefail, so `python3 harness_x.py | tee …` passed even when the harness failed — every lock
# here was silently unenforced until 2026-09-24. Locked by backend/harness_ci_pipefail_lock.py.
defaults:
  run:
    shell: bash

jobs:
  org-scope-guard:
    name: Sensitive queries are org-scoped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run org-scope guard
        working-directory: backend
        run: python3 harness_org_scope_guard.py | tee "$GITHUB_STEP_SUMMARY"

  undefined-names:
    # THE #244 CLASS (index §6k): a local moved into a helper strands a sibling that still reads it — a NameError
    # on every call that Python only finds when the line runs. stdlib `symtable`, no pip install: every scope of
    # every module under backend/app; a read name bound nowhere fails the build. Planted controls inside.
    name: No undefined names under backend/app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the undefined-name lock
        working-directory: backend
        run: python3 harness_undefined_names_lock.py | tee -a "$GITHUB_STEP_SUMMARY"

  auto-calc-lock:
    # AUTO-CALCULATION ON LANDING (owner 2026-09-28, index §6l): "data landed for org X, period P" has ONE home
    # (commcalc/auto_calc.py). Stdlib + ast, no pip install: every function under backend/app that writes a table
    # the Run Calculation reads must call auto_calc.landed(...) or be excused with a reason; nothing but the Run
    # Calculation button and the hook's runner may start _run_calculation; the runner keeps every guard armed;
    # the config has one reader; the registry covers what the calculation reads. Planted controls inside.
    name: One post-landing hook, one calculation trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the auto-calc-on-landing lock
        working-directory: backend
        run: python3 harness_auto_calc_lock.py | tee -a "$GITHUB_STEP_SUMMARY"

  feed-read-lock:
    # A PAGED READ IS A READ OF THE DATA (owner report 2026-10-14, index §CORE-05). `range()` paging with
    # no ORDER BY pages an UNORDERED set: measured live on one 137,374-row feed, the platform's own
    # "read every row" home returned 88,294 distinct rows with 49,080 duplicate copies and a third of the
    # feed never served — and reported nothing, because the loop still ended on a short page. That is what
    # made one subscriber account read as 27 activated lines when it carries nine. Stdlib + ast, no pip
    # install: the one home is driven over a fake backend that permutes an unordered read (armed — the
    # pre-fix loop fails it), its order cannot be removed or applied after the window, and every remaining
    # unordered paged read under backend/app is COUNTED against a pin that may only shrink.
    name: A paged read is a read of the data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the paged-read lock
        working-directory: backend
        run: python3 harness_feed_read_lock.py | tee -a "$GITHUB_STEP_SUMMARY"

  unique-numbers:
    # A NUMBER NAMES ONE THING (2026-09-28): #315 and #317 were merged the same day and both took migration 1030 and
    # index §19.32 — each branch was green against a main that lacked the other. Runs on the merged tree too (push to
    # main). Stdlib, no pip install: two migrations or two index sections on one number fail the build; the collisions
    # that predate this lock (already applied) are listed by exact name and may only shrink. Planted controls inside.
    name: Migration and index numbers are claimed once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the unique-numbers lock
        working-directory: backend
        run: python3 harness_unique_numbers_lock.py | tee -a "$GITHUB_STEP_SUMMARY"

  actor-uid-lock:
    # WHO DID THIS IS A UUID OR NULL (2026-09-28, index §19.34): `_caller_uid` returned 'web' for a token-less caller, and
    # installment_category_rule.updated_by is UUID (mig 245) — every automation/agent/poller save 500'd. Stdlib + ast, no
    # pip install: the real `_caller_uid` is exec'd and must return a UUID or None; it is the ONE home (no second copy);
    # every actor-column write under backend/app is traced to its literals and checked against the column types READ from
    # the migrations; the retired 'web' is written nowhere; the real save_category_rule is proven against a client that
    # enforces the declared types (the pre-fix helper reproduces the live 500). Planted controls inside.
    name: Actor columns get a UUID or NULL, never a sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the actor-uid lock
        working-directory: backend
        run: python3 harness_actor_uid_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the discrepancy-appeal proof (apply_appeal stamps appealed_by — a UUID or NULL)
        working-directory: backend
        run: python3 harness_discrepancy_appeals.py | tee -a "$GITHUB_STEP_SUMMARY"

  commission-withholding-locks:
    # A CLAWBACK IS RECOGNISED BY THE MONEY'S DIRECTION, IN ONE HOME (2026-10-06, index §55). The
    # CHARGEBACK detector asked `category == 'Chargeback'` — a category commcalc.payment_categories has
    # never been able to contain — so in four years it fired ZERO times while the house feed carried 474
    # 'Commission Withholding' rows worth $7,123.39 taken back, declared as `Commission` and therefore
    # also netting into commission earnings. Stdlib + ast, no pip install. The locks: one home for the
    # test, no second sign table, no revived category-name test (with an EXACT excuse inventory of the
    # three money sites, so a new one fails AND a fixed one left listed fails), every caller wired, one
    # appeal state machine across both its tables, and the mig-1060 columns matching mig 947's. The
    # proofs carry the regression that reproduces the live shape end to end.
    name: One clawback test, one appeal state machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the clawback lock (one home, no second sign table, the excuse inventory)
        working-directory: backend
        run: python3 harness_clawback_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the appeal one-machine lock (one transition table, mig 1060 ⇄ mig 947)
        working-directory: backend
        run: python3 harness_appeal_one_machine_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the clawback proof (the sign rule, the declarations, the live-shape regression)
        working-directory: backend
        run: python3 harness_clawback.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the withholding-report proof (the cutoff, the IMEI fence, the parallel leg)
        working-directory: backend
        run: python3 harness_withholding_report.py | tee -a "$GITHUB_STEP_SUMMARY"
      # Owner ask 2026-10-07 ("impossible to check which item is commsison or rebate"): the pay
      # CATEGORY got one home because commcalc.payment_categories already had NINE private readers
      # folding its key nine ways. These two keep the tenth from appearing — index §57.
      - name: Run the payment-category home lock (one reader, the excused nine, RULE TWO)
        working-directory: backend
        run: python3 harness_payment_category_home_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the payment-category proof (the fold, absence kept as absence, the filter)
        working-directory: backend
        run: python3 harness_payment_category.py | tee -a "$GITHUB_STEP_SUMMARY"

  row-save-lock:
    # ONE ROW, ONE SAVE (2026-09-29, index §19.35): HR → Employees & Pay had one save button PER SLICE of a row; the Vzone
    # admin typed hourly rates, pressed the Lunch button, and the pay PATCH was never sent (access log: 4x PUT lunch-config,
    # 0x PATCH). The lock (stdlib): every employee-record write in the frontend is built in lib/employeeRowSlices.ts and
    # planned by lib/rowSave.ts::planRowSave from a registered *_ROW_SLICES set (never a subset); users of the slices
    # install the leave guard; one copy of the dirty comparison; the slices name only fields the backend reads; the
    # StoreOps grids not yet migrated are a ratchet that may only shrink. The proof (Node 22 strips the real modules'
    # TypeScript; no npm install): the reported defect reproduced, bodies unchanged, honest per-slice results.
    name: One row, one save (employee-record editors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run the row-save lock
        working-directory: backend
        run: python3 harness_row_save_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the row-save proof (the real rowSave.ts + employeeRowSlices.ts)
        working-directory: frontend
        run: node prove_row_save.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  employee-write-locks:
    # EMPLOYEE PAY WRITES + CHANGE-LOG IDENTITY (2026-10-03, index §19.44 / §19.45). The pay-write rule lived inline in
    # PATCH /employees alone — the create, bulk-create, HR-create and payscale-upload paths wrote pay with no "may this
    # caller see pay?" check. And the payroll change log took WHO from whatever its caller held: Vzone's id 237 was logged
    # with no employee number because the business id was minted after the row was written. The locks (stdlib): every
    # employee pay writer calls storeops.gate_pay_write before writing; only _log_payroll_change writes the log and it
    # builds identity through payroll_log_identity.resolve_log_identity; every employees insert mints. The proof execs the
    # real handlers against an in-memory database and reproduces both defects on the pre-fix source first.
    name: Employee pay writes + change-log identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the pay-write gate lock
        working-directory: backend
        run: python3 harness_pay_write_gate_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the change-log identity lock
        working-directory: backend
        run: python3 harness_payroll_log_identity_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the employee-write proof (the real handlers, both defects reproduced then fixed)
        working-directory: backend
        run: python3 harness_employee_write_proof.py | tee -a "$GITHUB_STEP_SUMMARY"
      # §CORE-07, the sibling of the one mint above: that gives the PERSON a business id, this makes the
      # LOGIN point at it. A login with app_users.employee_id NULL is nobody — a blank Schedule and a
      # closer_no_name refusal on Submit Closing — and two of the three create paths never wrote it.
      - name: Run the login/employee link lock
        working-directory: backend
        run: python3 harness_app_user_employee_link.py | tee -a "$GITHUB_STEP_SUMMARY"

  self-lockout:
    # §CORE-12 — "would this administrative write take away the authority that just made it?" is ONE
    # home (backend/app/modules/core/self_lockout.py) that every role / membership / role-permission
    # writer in core/router.py dereferences, and the AUTHORITY ANSWER ITSELF (can_edit_setting) lives
    # there rather than in the router, so the guard and the gate cannot drift apart. The failure mode
    # is an ABSENT call in a NEW writer, which nothing else can see, so the lock derives its subject
    # set from the router source. Live instance 2026-10-16: the ss@1313global.us login demoted its own
    # Vzone membership to market_manager and no screen was left that could undo it.
    name: A write may not lock out its own author
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the self-lockout lock (stdlib only, no deps)
        working-directory: backend
        run: python3 harness_self_lockout.py | tee -a "$GITHUB_STEP_SUMMARY"

  hub-viewer-gate:
    # §CORE-06 — "may THIS viewer open THIS page from a tile" is ONE home (frontend/src/lib/hub-gate.ts)
    # that every HubTiles consumer dereferences. The two CURATED hubs (/storeops, /payroll) rendered a
    # hand-woven tile literal with NO gate at all, so the Workforce dashboard — the only door to the
    # tileOnly /storeops/schedule page — offered a store-scoped rep 11 of its 21 interior links and 2 of
    # its 6 KPI tiles pointing at pages the route guard bounces. The LOCK is static on purpose: the
    # failure mode is an ABSENT filter, so the page compiles, renders and simply offers dead links, which
    # neither tsc nor a build can see. The PROOF re-implements the shipped predicates verbatim and runs
    # them against the real NAV, the real tile literals and the real production role rows, reproducing
    # the defect on the pre-fix surface before showing it closed.
    name: Hub viewer gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the hub viewer-gate lock (stdlib only, no deps)
        working-directory: backend
        run: python3 harness_hub_viewer_gate.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run the hub viewer-gate proof (real NAV, real tile literals, real role rows)
        working-directory: frontend/scratchpad
        run: node prove_hub_gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  assign-password-one-home:
    # §CORE-09 — "assign this employee a password I type" is ONE home
    # (frontend/src/components/AssignPasswordCard.tsx) that all three surfaces offering it render:
    # Admin → Security Settings, Admin → Roles (👥 Assign people, "in config") and the Payroll hub's
    # new Manage Employees tile (/hr/employee-password). The CAPABILITY was already correct and had one
    # server path (POST /core/users/set-password, gated on _can_edit_setting(caller,'security')); what
    # was missing was a door for the people who manage employees, and the patchwork answer would have
    # been to retype the form, the fetch and the policy echo on each new surface. The LOCK is static on
    # purpose: a surface that re-implements the card compiles and looks right, and a tile that loses a
    # door is still a valid tile — neither tsc nor a build can see either. The PROOF runs the shipped
    # viewer gate over the real NAV and the real tile literal and shows why the password door had to be
    # an `hr` route: pointed at /admin/security it is dropped for every HR and market manager.
    name: Assign-password one home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the assign-password one-home lock (stdlib only, no deps)
        working-directory: backend
        run: python3 harness_assign_password_one_home.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run the Manage Employees tile proof (real NAV, real tile literal, real role rows)
        working-directory: frontend/scratchpad
        run: node prove_manage_employees_tile.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  people-visibility:
    # §14w — "whose PERSON-KEYED rows may this login READ?" is ONE declared fact (app/core/scope.py:
    # people_visibility / visible_people_keyset) that every schedule, attendance and per-rep report
    # read dereferences through ONE gate (storeops.gate_person_rows / schedule_emp_ids), plus the
    # store-span half: a MARKET pin no longer widens a scope-'store' reporting span, which is what
    # made the sales report company-wide for a rep. The lock fails the build if the ruling is copied,
    # the wiring re-derived, a wired read stops asking, a NEW person-keyed GET lands unwired, the
    # market-grant refusal is undone, the flags queue grows its own rep predicate, or the frontend
    # mirror drifts. The PROOF runs the real endpoints and reproduces both reported leaks on the
    # PRE-FIX gate before showing them closed.
    name: People visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Run the people-visibility lock (stdlib only, no deps)
        working-directory: backend
        run: python3 harness_people_visibility_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install backend deps (the proof execs the real endpoints)
        run: pip install -r backend/requirements.txt
      - name: Run the people-visibility proof (real endpoints, both leaks reproduced)
        working-directory: backend
        run: python3 harness_people_visibility.py | tee -a "$GITHUB_STEP_SUMMARY"
