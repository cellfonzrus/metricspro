name: security

# Security gates (Security Controls Spec §5, item 12): SAST, dependency/SCA, and secret scanning.
#
# REPORT-ONLY to start: every scan step is `continue-on-error`, so findings are surfaced in the job
# summary and logs but do NOT fail the build yet. Once the baseline is clean, drop `continue-on-error`
# (or make these required checks) to enforce — tracked in docs/SECURITY_DAILY_QUESTIONS.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly drift check, Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Every step runs under `bash -eo pipefail` (GitHub's explicit-bash shell). Without this, the default
# `bash -e` has NO pipefail, so `python3 harness_x.py | tee …` passed even when the harness failed — every lock
# here was silently unenforced until 2026-09-24. Locked by backend/harness_ci_pipefail_lock.py.
defaults:
  run:
    shell: bash

jobs:
  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install bandit
      - name: bandit
        continue-on-error: true
        run: bandit -r backend/app -ll -f txt | tee "$GITHUB_STEP_SUMMARY"

  python-deps:
    name: Python deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc | tee "$GITHUB_STEP_SUMMARY"

  frontend-deps:
    name: Frontend deps (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high || true

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install semgrep
      - name: semgrep
        continue-on-error: true
        run: semgrep scan --config auto --error --output-format text backend/app || semgrep scan --config auto backend/app || true

  secrets:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  pos-pii-grants:
    # Enforcing (not report-only): migration 909 switched the SSN / DL functions off; a copied schema-wide GRANT in
    # 1017 re-opened them to service_role (repaired by 1019). This fails the build if any later migration does it again.
    name: PII functions stay switched off (migration lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_pos_grants_lock
        run: python backend/harness_pos_grants_lock.py

  data-api-grants:
    # Enforcing (index §CORE-13). Supabase stops auto-granting Data API access to new tables in
    # `public` on 2026-10-30, and this backend reaches EVERY table through PostgREST — so an
    # ungranted relation is invisible to the application, not just to the browser. A migration
    # newer than the gate's cutoff must grant what it creates to service_role, in the same file.
    name: A new table is granted by the migration that creates it (Data API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_data_api_grant_guard
        run: python backend/harness_data_api_grant_guard.py

  public-allowlist:
    # Enforcing (security review 2026-10-28). The public allowlist used to treat ANY path ending in
    # "/run-due" as a self-authenticating cron entrypoint. 249 routes in this app end in a path
    # PARAMETER, so asking for one with the literal value `run-due` skipped BOTH the auth requirement
    # and the org_id rewrite — an unauthenticated write into, and recalculation of, any tenant's data.
    # The set is now DERIVED from the app's own route table; this fails the build if a parameterised
    # route can ever be reached that way again.
    name: A parameterised route can never be public (allowlist lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: harness_public_allowlist_lock
        run: python backend/harness_public_allowlist_lock.py

  client-ip:
    # Enforcing (security review 2026-10-28). Four modules each read the LEFTMOST X-Forwarded-For
    # entry, which is the value the CLIENT typed — so the per-IP rate limiter, the IP block list and
    # the access log's `ip` column were all attacker-controlled. `app/core/client_ip.py` is now the
    # ONE home; this fails the build if a fifth copy appears or a wired site stops dereferencing it.
    name: The client address has one home (X-Forwarded-For lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: harness_client_ip
        run: python backend/harness_client_ip.py

  anonymous-write-surface:
    # Enforcing (security review 2026-10-28). The crash logger filed its core.failure_log row under
    # the CALLER-DECLARED ?org_id= — the exact thing the middleware's own outage logger was already
    # fixed not to do — so an anonymous caller who could provoke a 500 wrote rows into any tenant's
    # Failure Logs. Also pins the cap on the client-asserted login outcome.
    name: What an anonymous caller may write, and under whose name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - name: harness_anonymous_write_surface
        run: python backend/harness_anonymous_write_surface.py

  ci-pipefail:
    # Enforcing: a failing harness must fail CI (index §19.25). Before 2026-09-24 every
    # `python3 harness_x.py | tee …` step ran without pipefail and passed on a red harness.
    name: A failing harness fails CI (pipefail lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_ci_pipefail_lock
        run: python backend/harness_ci_pipefail_lock.py

  subject-set:
    # Enforcing (index §CORE-10). The sibling of the pipefail lock above: that one fails a build when a
    # guard goes RED unnoticed, this one fails a build when a guard goes BLIND unnoticed. A guard that
    # derives its subjects by scanning the code must compare them with a DECLARED set, because a subject
    # leaving the derived set takes its own assertions with it — silently (PR #477, 2026-10-14).
    name: A guard that goes blind fails CI (derived subject sets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: harness_subject_set_lock
        run: python backend/harness_subject_set_lock.py
